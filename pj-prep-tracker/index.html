<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PJ Indoc Prep Tracker</title>
<meta name="theme-color" content="#1b1d22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PJ Prep">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{color-scheme:light;--mar:#7a1f2b;--ink:#1b1d22;--steel:#5a6270;--line:#dcdfe4;--tint:#f6f1eb;--soft:#f5f6f8;--ok:#1f7a3a;--okb:#e3f4e6;--part:#9a6b00;--partb:#fff3d1;--bad:#b42318;--badb:#fde8e8;--gold:#fff6de}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#fafafa;font-size:14px}
header{background:var(--ink);color:#fff;padding:12px 16px 0;position:sticky;top:0;z-index:10}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:17px;letter-spacing:2px;margin:0;font-weight:900}h1 span{color:#e3a0aa}
.sub{font-size:11.5px;color:#c7cbd2}
nav{display:flex;gap:2px;margin-top:10px;overflow-x:auto}
nav button{background:none;border:none;color:#c7cbd2;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:#e3a0aa}
main{max-width:980px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .l{font-size:11px;color:var(--steel);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.kpi .v{font-size:20px;font-weight:800;margin-top:2px}.kpi .s{font-size:11.5px;color:var(--steel)}
.bar{height:7px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--mar)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;border-left:5px solid var(--mar);padding-left:10px;margin-bottom:8px}
.dayhead b{font-size:18px}.theme{color:var(--mar);font-style:italic;font-size:13px}
.sess{border:1px solid var(--line);border-radius:8px;margin:10px 0;overflow:hidden}
.sesshead{background:var(--soft);padding:7px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:13px;color:var(--steel)}
.tag{font-size:10px;font-weight:800;letter-spacing:1px;color:#fff;padding:2px 6px;border-radius:3px}
.t-RUN{background:#2f5d8a}.t-PT{background:var(--mar)}.t-POOL{background:#1f7a78}.t-RUCK{background:#6b5a2e}.t-LIFT{background:#3d3d3d}.t-MOB{background:#6b7280}.t-TEST,.t-IFT{background:var(--bad)}
.line{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px 10px;padding:8px 10px;border-top:1px solid var(--line);align-items:center}
.line .ex{font-weight:700;font-size:13.5px}.line .tg{font-size:13px}.line .nt{font-size:11.5px;color:var(--steel);font-style:italic}
.line input.act{grid-column:2/4;width:100%}
.chk{width:30px;height:30px;border-radius:7px;border:2px solid #b9bdc4;background:#fff;font-size:16px;font-weight:900;cursor:pointer;color:#fff}
.chk.Y{background:var(--ok);border-color:var(--ok)}.chk.P{background:#d69e00;border-color:#d69e00}.chk.N{background:var(--bad);border-color:var(--bad)}
.line.Y{background:var(--okb)}.line.P{background:var(--partb)}.line.N{background:var(--badb)}
.metrics{display:flex;gap:10px;flex-wrap:wrap;padding:8px 10px;border-top:1px dashed var(--line);background:#fcfcfd}
.metrics label{font-size:11.5px;color:var(--steel);font-weight:700;display:flex;flex-direction:column;gap:2px}
input,select,textarea{font:inherit;border:1px solid #c9ccd2;border-radius:6px;padding:6px 8px;background:#fffdf5}
input:focus,textarea:focus,select:focus{outline:2px solid #e3a0aa;border-color:var(--mar)}
.metrics input{width:90px}
button.btn{background:var(--mar);color:#fff;border:none;border-radius:7px;padding:8px 14px;font-weight:700;cursor:pointer}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 12px;font-weight:700;cursor:pointer}
button.ghost:hover{border-color:var(--mar)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--steel);background:var(--soft)}
td input{width:100%;min-width:52px}
.pos{color:var(--ok);font-weight:800}.neg{color:var(--bad);font-weight:800}
.banner{padding:9px 12px;border-radius:8px;margin-bottom:10px;font-weight:700;font-size:13px}
.b-deload{background:var(--gold);color:#6d5200}.b-ift{background:var(--badb);color:var(--bad)}.b-info{background:#eef4fb;color:#244a70}.b-warn{background:var(--badb);color:var(--bad)}
.weekgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.wd{border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;background:#fff}
.wd:hover{border-color:var(--mar)}.wd.today{outline:2px solid var(--mar)}
.wd b{display:block}.wd small{color:var(--steel);display:block;font-size:11.5px}
.chart{position:relative;height:250px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.muted{color:var(--steel);font-size:12px}
h2{font-size:14px;letter-spacing:1.5px;text-transform:uppercase;margin:4px 0 10px}
.checkin{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.checkin label{font-size:11.5px;color:var(--steel);font-weight:700;display:flex;flex-direction:column;gap:3px}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:800;background:var(--soft);color:var(--steel)}
.hide{display:none}
@media (max-width:560px){.line{grid-template-columns:34px 1fr}.line .tg{grid-column:2}.line input.act{grid-column:1/3}}
</style>
</head>

// ---------- metrics per session ----------
function metricDefs(tag,label){
  if(tag==='RUN') return [['mi','Miles']];
  if(tag==='POOL') return [['yd','Yards']];
  if(tag==='RUCK'){const m=[['rmi','Ruck mi'],['lb','Load lb'],['pace','Pace (m:ss/mi)']]; if(/5x5/.test(label)) m.push(['runmi','Run leg mi']); return m;}
  return [];
}
function mmss2min(s){if(!s)return null;s=String(s).trim();if(s.includes(':')){const [a,b]=s.split(':');return (+a)+(+b||0)/60;}const n=parseFloat(s);return isNaN(n)?null:n;}
function min2mmss(v){if(v==null||isNaN(v))return '';const m=Math.floor(v),s=Math.round((v-m)*60);return m+':'+String(s===60?0:s).padStart(2,'0');}

// ---------- week stats ----------
function weekStats(w){
  let total=0,done=0,mi=0,yd=0,hlb=null,hpace=null;
  w.days.forEach((d,di)=>d.sess.forEach((s,si)=>{
    s[2].forEach((l,li)=>{total++;const st=(S.lines[`${w.n}|${di}|${si}|${li}`]||{}).s;if(st==='Y')done++;else if(st==='P')done+=.5;});
    const m=S.met[`${w.n}|${di}|${si}`]||{};
    mi+=(+m.mi||0)+(+m.runmi||0); yd+=(+m.yd||0);
    if(di===1&&s[0]==='RUCK'){if(m.lb)hlb=+m.lb;if(m.pace)hpace=m.pace;}
  }));
  const dl=w.days.map(d=>S.daily[d.date]||{});
  const avg=k=>{const v=dl.map(x=>parseFloat(x[k])).filter(x=>!isNaN(x));return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  return {total,done,pct:total?done/total:0,mi,yd,hlb,hpace,sleep:avg('sleep'),rpe:avg('rpe'),sore:avg('sore'),bw:avg('bw')};
}
function dayStats(w,di){let t=0,dn=0;w.days[di].sess.forEach((s,si)=>s[2].forEach((l,li)=>{t++;const st=(S.lines[`${w.n}|${di}|${si}|${li}`]||{}).s;if(st==='Y')dn++;else if(st==='P')dn+=.5;}));return {t,dn};}

  el('wp').onclick=()=>{if(selWeek>1){selWeek--;render();}}; el('wn').onclick=()=>{if(selWeek<12){selWeek++;render();}};
  A.querySelectorAll('.wd').forEach(x=>x.onclick=()=>{selDate=x.dataset.date;view='today';render();window.scrollTo(0,0);});
  A.querySelectorAll('[data-rv]').forEach(t=>t.oninput=()=>{(S.review[w.n]=S.review[w.n]||{})[t.dataset.rv]=t.value;save();});
}
function gap(v,std){if(v===''||v==null)return '';const g=v-std;return `<span class="${g>=0?'pos':'neg'}">${g>=0?'+':''}${g}</span>`;}

  const line=(v,c,l)=>({label:l,data:rows.map(()=>v),borderColor:c,borderDash:[5,4],pointRadius:0,borderWidth:1});
  charts.ift=new Chart(el('c-ift'),{type:'line',data:{labels:lab,datasets:[ds('pull','#2f5d8a'),ds('sit','#7a1f2b'),ds('push','#1f7a78'),line(75,'#7a1f2b','Indoc sit 75'),line(70,'#1f7a78','Indoc push 70'),line(13,'#2f5d8a','Indoc pull 13')]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:12,font:{size:11}}}}}});

   <div class="card"><h2>Run miles · plan vs actual</h2><div class="chart"><canvas id="c1"></canvas></div></div>

function vData(A){
  const json=JSON.stringify(S);
  A.innerHTML=`<div class="card"><h2>Backup</h2><p class="muted">Your log is saved in this app on this device. Copy a backup now and then (e.g. into a note or email to yourself). To restore, paste it below.</p>
  <div class="row"><button class="btn" id="copy">Copy backup</button><button class="ghost" id="dl">Download .json</button><span class="muted" id="cmsg"></span></div>
  <textarea id="bk" rows="5" style="width:100%;margin-top:10px;font-family:monospace;font-size:11px">${esc(json)}</textarea></div>
  <div class="card"><h2>Sync across devices (GitHub)</h2>
  <p class="muted">Optional. Stores your log in a <b>secret gist</b> on your own GitHub account, so your phone and laptop stay in sync. Create a token at github.com → Settings → Developer settings → Personal access tokens → <b>Fine-grained</b>, with only <b>Gists: Read and write</b>. Paste it here on each device. The token stays in this browser only. A secret gist is unlisted, not encrypted, so don't put anything sensitive in your notes.</p>
  <div class="checkin"><label>GitHub token<input type="password" id="tok" value="${esc(syncCfg().token)}" placeholder="github_pat_…"></label><label>Gist ID (auto)<input id="gid" value="${esc(syncCfg().gist)}" placeholder="created on first sync"></label></div>
  <div class="row" style="margin-top:8px"><button class="btn" id="sconn">Save &amp; connect</button><button class="ghost" id="spush">Push now</button><button class="ghost" id="spull">Pull now</button><button class="ghost" id="soff">Disconnect</button><span class="muted" id="smsg">${syncCfg().token?('Connected'+(syncCfg().last?' · last sync '+new Date(syncCfg().last).toLocaleString():'')):'Not connected'}</span></div></div>
  <div class="card"><h2>Restore</h2><textarea id="rs" rows="5" style="width:100%;font-family:monospace;font-size:11px" placeholder="paste a backup here"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="restore">Restore</button><button class="ghost" id="csv">Export log as CSV</button></div></div>
  <div class="card"><h2>Reset</h2><button class="ghost" id="reset" style="color:var(--bad)">Erase all logged data</button></div>`;
  el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(json);el('cmsg').textContent='Copied ✓';}catch(e){el('bk').select();el('cmsg').textContent='Select-all + copy the box below';}};
  el('dl').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download='pj-prep-backup-'+todayISO+'.json';a.click();}catch(e){el('cmsg').textContent='Download blocked here; use Copy.';}};
  el('restore').onclick=()=>{try{const o=JSON.parse(el('rs').value);if(o.v!==1)throw 0;S=o;save();alert('Restored.');render();}catch(e){alert('That doesn\'t look like a valid backup.');}};
  el('csv').onclick=()=>{const out=[['week','date','day','tag','session','exercise','target','done','actual']];PLAN.forEach(w=>w.days.forEach((d,di)=>d.sess.forEach((s,si)=>s[2].forEach((r,li)=>{const L=S.lines[`${w.n}|${di}|${si}|${li}`]||{};out.push([w.n,d.date,d.name,s[0],s[1],r[0],r[1],L.s||'',L.a||'']);}))));
    const csv=out.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='pj-prep-log.csv';a.click();}catch(e){el('rs').value=csv;}};
  el('sconn').onclick=async()=>{const c={token:el('tok').value.trim(),gist:el('gid').value.trim()};if(!c.token){el('smsg').textContent='Paste a token first.';return;}setSyncCfg(c);el('smsg').textContent='Connecting…';
    try{if(!c.gist){const id=await findExistingGist();if(id){c.gist=id;setSyncCfg(c);}}
      if(c.gist){const pulled=await pullNow(false);if(!pulled)await pushNow();}else{await pushNow();}
      el('smsg').textContent='Connected ✓ gist '+(syncCfg().gist||'');el('gid').value=syncCfg().gist||'';}catch(e){el('smsg').textContent='⚠ '+e.message;}};
  el('spush').onclick=async()=>{await pushNow();el('smsg').textContent=el('savestate').textContent;};
  el('spull').onclick=async()=>{await pullNow(true);};
  el('soff').onclick=()=>{setSyncCfg({});el('smsg').textContent='Disconnected (data stays on this device and in the gist).';el('tok').value='';};
  el('reset').onclick=()=>{if(confirm('Erase everything you have logged? This cannot be undone.')){S={v:1,lines:{},met:{},daily:{},review:{},ift:SEED_IFT.slice(),tests:{}};save();render();}};
}
// ---------- cloud sync (GitHub Gist) ----------
const SKEY='pjprep.sync', GFILE='pj-prep-data.json';
function syncCfg(){try{return JSON.parse(localStorage.getItem(SKEY))||{};}catch(e){return {};}}
function setSyncCfg(c){try{localStorage.setItem(SKEY,JSON.stringify(c));}catch(e){}}
function setSyncMsg(m){const x=el('savestate');if(x)x.textContent=m;}
async function gh(path,method='GET',body){const c=syncCfg();const r=await fetch('https://api.github.com'+path,{method,headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error('GitHub '+r.status);return r.json();}
let pushT=null, pushing=false;
function schedulePush(){const c=syncCfg();if(!c.token)return;clearTimeout(pushT);pushT=setTimeout(pushNow,4000);}
async function pushNow(){const c=syncCfg();if(!c.token||pushing)return;pushing=true;
  try{const files={};files[GFILE]={content:JSON.stringify(S)};
    if(c.gist){await gh('/gists/'+c.gist,'PATCH',{files});}
    else{const g=await gh('/gists','POST',{description:'PJ Prep tracker data (auto-sync)',public:false,files});c.gist=g.id;setSyncCfg(c);}
    c.last=Date.now();setSyncCfg(c);setSyncMsg('Synced ☁ '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
  }catch(e){setSyncMsg('⚠ Sync failed ('+e.message+'). Saved on this device.');}
  pushing=false;}
async function pullNow(force){const c=syncCfg();if(!c.token||!c.gist)return false;
  try{const g=await gh('/gists/'+c.gist);const f=g.files[GFILE];if(!f)return false;
    let txt=f.content; if(f.truncated){txt=await (await fetch(f.raw_url)).text();}
    const o=JSON.parse(txt); if(o.v!==1)return false;
    if(force||(o.updated||0)>(S.updated||0)){S=o;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}render();setSyncMsg('Pulled latest ☁');return true;}
    setSyncMsg('Up to date ☁');return false;
  }catch(e){setSyncMsg('⚠ Sync offline ('+e.message+')');return false;}}
async function findExistingGist(){const list=await gh('/gists?per_page=100');const g=list.find(x=>x.files&&x.files[GFILE]);return g?g.id:null;}
window.addEventListener('focus',()=>{if(syncCfg().token)pullNow(false);});

document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();window.scrollTo(0,0);});
el('hdrsub').textContent=`Phase 2 · Week ${curWeek()} of 12 · Oct 5 → Dec 27, 2026`;
render();
if(syncCfg().token)pullNow(false);
if('serviceWorker' in navigator && location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
console.log('pj tracker loaded', PLAN.length,'weeks');
</script>
